name: new115 OpenTUI Input original and candidate verification
on:
  workflow_dispatch:
  push:
    branches: [codex/verify-input-keybindings115]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [original, candidate]
    env:
      NEW115_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout whole immutable original upstream
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: anomalyco/opentui
          ref: ea1127e9bf4562cd0020bf6d421e806a222bd040
          fetch-depth: 1
          persist-credentials: false
      - name: Setup pinned Bun with cache writes disabled
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
          no-cache: true
      - name: Setup upstream-declared Node with no dependency cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Initialize temporary evidence and exact tree expectations
        shell: bash
        run: |
          set -euo pipefail
          new115_evidence="$RUNNER_TEMP/new115-$NEW115_VARIANT"
          mkdir -p "$new115_evidence"
          echo "NEW104_EVIDENCE=$new115_evidence" >> "$GITHUB_ENV"
          if [ "$NEW115_VARIANT" = original ]; then
            echo "NEW115_EXPECTED_TREE=c9bf9451aeb57e6402a3668932459dd2a66d3c8e" >> "$GITHUB_ENV"
          else
            echo "NEW115_EXPECTED_TREE=11789e903de45552ceb17fd428d1f3407a1a30ef" >> "$GITHUB_ENV"
          fi
          echo 'NEW115_FIXTURES={"packages/core/new104-before.ts":"9d94c36fd4af4b37b2cf55b6ada4ae59176a9cce2e619c618c322e3f4dec8584","packages/react/new104-before.ts":"00cb67e7f11e51da0b99092f8c70ae339acc13b572590bf8110241410ecf42eb","packages/solid/new104-before.tsx":"4d2aaead4a8c8331e4b5d8c3aee9529947c26f8fd80a53a971f588d6189eef9b"}' >> "$GITHUB_ENV"
      - name: Stage source/runtime/fixture guard
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode > "$NEW104_EVIDENCE/guard.py" <<'NEW115_DATA'
          
          NEW115_DATA
          echo '4fcf2fb2dfd0f1615b5fb4faf262af185947b3caaf1452e90221a1ba328bcc42  '"$NEW104_EVIDENCE/guard.py" | sha256sum --check
      - name: Stage immutable raw assessor
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode > "$NEW104_EVIDENCE/assess-raw.py" <<'NEW115_DATA'
          
          NEW115_DATA
          echo '3f0958f292e8abeef62107b26af90badeb3944db19a8fcde9d453bab4d194480  '"$NEW104_EVIDENCE/assess-raw.py" | sha256sum --check
      - name: Stage official validation runner
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode > "$NEW104_EVIDENCE/checks.py" <<'NEW115_DATA'
          
          NEW115_DATA
          echo '1e322ac301f822050f95b9d6287054482a0a023b9518da2d29c19261dcc7e963  '"$NEW104_EVIDENCE/checks.py" | sha256sum --check
      - name: Stage exact reviewed candidate patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode > "$NEW104_EVIDENCE/candidate.patch" <<'NEW115_DATA'
          
          NEW115_DATA
          echo 'c771e23db42328e6bffed47d5e83f6c86c6d71d2f18be8e3f8ddde7c5539657b  '"$NEW104_EVIDENCE/candidate.patch" | sha256sum --check
      - name: Stage exact permanent regression files and manifest
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode > "$NEW104_EVIDENCE/changes.json" <<'NEW115_DATA'
          
          NEW115_DATA
          echo '54de61ba344a9d3dae25162a54b8d680422bbad7f58291d4de91afde83960959  '"$NEW104_EVIDENCE/changes.json" | sha256sum --check
      - name: Stage unchanged original core diagnostic driver
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode > packages/core/new104-before.ts <<'NEW115_DATA'
          
          NEW115_DATA
          echo '9d94c36fd4af4b37b2cf55b6ada4ae59176a9cce2e619c618c322e3f4dec8584  'packages/core/new104-before.ts | sha256sum --check
      - name: Stage unchanged original react diagnostic driver
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode > packages/react/new104-before.ts <<'NEW115_DATA'
          
          NEW115_DATA
          echo '00cb67e7f11e51da0b99092f8c70ae339acc13b572590bf8110241410ecf42eb  'packages/react/new104-before.ts | sha256sum --check
      - name: Stage unchanged original solid diagnostic driver
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode > packages/solid/new104-before.tsx <<'NEW115_DATA'
          
          NEW115_DATA
          echo '4d2aaead4a8c8331e4b5d8c3aee9529947c26f8fd80a53a971f588d6189eef9b  'packages/solid/new104-before.tsx | sha256sum --check
      - name: Select reviewed candidate or untouched original
        shell: bash
        run: |
          set -euo pipefail
          if [ "$NEW115_VARIANT" = candidate ]; then
            git apply --check "$NEW104_EVIDENCE/candidate.patch"
            git apply --index "$NEW104_EVIDENCE/candidate.patch"
          fi
          python3 "$NEW104_EVIDENCE/guard.py" source
      - name: Install pinned Zig archive without cache upload
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .zig-version)" = 0.17.0
          archive="$RUNNER_TEMP/new115-zig.tar.xz"
          curl -fL --connect-timeout 15 --max-time 300 https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o "$archive"
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  $archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"
          {
            echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/new115-zig-global"
            echo "ZIG_LOCAL_CACHE_DIR=$RUNNER_TEMP/new115-zig-local"
          } >> "$GITHUB_ENV"
      - name: Install frozen dependencies and build actual source-native baseline
        id: build
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.1
          test "$(zig version)" = 0.17.0
          test "$(node --version)" = "v$(cat .node-version)"
          bun install --frozen-lockfile
          (cd packages/core && bun run build:native && bun run build:lib)
          python3 "$NEW104_EVIDENCE/guard.py" before
      - name: Run unchanged original core probe and print raw status
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          (cd packages/core && bun new104-before.ts) 2>&1 | tee "$NEW104_EVIDENCE/core.log"
          status=${PIPESTATUS[0]}
          echo "NEW104_PROCESS core $status"
          echo "$status" > "$NEW104_EVIDENCE/core.status"
          exit 0
      - name: Run unchanged original react probe and print raw status
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          (cd packages/react && bun new104-before.ts) 2>&1 | tee "$NEW104_EVIDENCE/react.log"
          status=${PIPESTATUS[0]}
          echo "NEW104_PROCESS react $status"
          echo "$status" > "$NEW104_EVIDENCE/react.status"
          exit 0
      - name: Run unchanged original solid probe and print raw status
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          (cd packages/solid && bun --preload ./scripts/preload.ts new104-before.tsx) 2>&1 | tee "$NEW104_EVIDENCE/solid.log"
          status=${PIPESTATUS[0]}
          echo "NEW104_PROCESS solid $status"
          echo "$status" > "$NEW104_EVIDENCE/solid.status"
          exit 0
      - name: Verify all source runtime and actual driver bytes before assessing
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$NEW104_EVIDENCE/guard.py" after
      - name: Independently assess immutable raw snapshots with frozen predicates
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$NEW104_EVIDENCE/assess-raw.py"
      - name: Run focused red or green regressions then all applicable official gates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$NEW104_EVIDENCE/checks.py"
